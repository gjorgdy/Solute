plugins {
	id "com.modrinth.minotaur" version "2.+"
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
	maven { url 'https://maven.wispforest.io' }
	maven { url 'https://repo1.maven.org/maven2/' }
	exclusiveContent {
		forRepository {
			maven { url = "https://api.modrinth.com/maven" }
		}
		filter { includeGroup "maven.modrinth" }
	}
	maven {
		name = "FzzyMaven"
		url = uri("https://maven.fzzyhmstrs.me/")
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	// Config API
	modImplementation("me.fzzyhmstrs:fzzy_config:${project.fzzyConfigVersion}")
}

processResources {
	inputs.property "version", project.version
	inputs.property "minecraft_version", project.minecraft_version
	inputs.property "loader_version", project.loader_version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version,
				"minecraft_version": project.minecraft_version,
				"loader_version": project.loader_version
	}
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
	// ensure that the encoding is set to UTF-8, no matter what the system default is
	// this fixes some edge cases with special characters not displaying correctly
	// see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
	// If Javadoc is generated, this must be specified in that task too.
	it.options.encoding = "UTF-8"
	if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
		it.options.release.set(targetJavaVersion)
	}
}

fabricApi {
	configureDataGeneration() {
		client = true
	}
}

java {
	def javaVersion = JavaVersion.toVersion(targetJavaVersion)
	if (JavaVersion.current() < javaVersion) {
		toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	}
	archivesBaseName = project.archives_base_name
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.archivesBaseName}"}
	}
}

// build.gradle
modrinth {
	token = "-"
	projectId = project.archives_base_name
	versionNumber = "1.11.1"
	versionType = "release"
	uploadFile = jar
	gameVersions = [project.minecraft_version]
	loaders = ["fabric"]
	changelog = "FIX-11: items no longer turn into their crushed variants by lava\nFIX-12: ladders do not stay floating if a supporting ladder is removed\nchanged the generation of stone generators in badlands biomes"
	dependencies {
		required.project "fabric-api"
		required.project "fzzy-config"
	}
}

static String getModrinthToken() {
    return new File('.env')
            .readLines()
            .findAll { it?.trim() && !it.trim().startsWith('#') }
            .collect { it.split('=') }
            .find { it[0] == 'MODRINTH_TOKEN' }[1]
}

static String readChangelog() {
    return new File('changelog.md')
            .readLines()
            .join('\n')
}

modrinth {
    token = getModrinthToken()
    projectId = project.mod_id
    versionNumber = "${project.version}"
    changelog = readChangelog()
    versionType = project.mod_release_type
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    dependencies {
        required.project "fabric-api"
        required.version "fzzy-config", project.fzzyConfigVersion
    }
}